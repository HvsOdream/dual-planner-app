name = "dual-planner-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "PLANNER"
id = "82e7f317dbe74a3eba8d26f4a5fbb3dc"

# 비서 연결(로그인 방식)의 클라이언트·인가 코드·토큰 저장소
[[durable_objects.bindings]]
name = "OAUTH"
class_name = "OAuthStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OAuthStore"]

# 속지 비서 모델: Workers AI. LLM_URL(OpenAI 호환 sLLM)을 [vars]에 넣으면 그쪽을 쓴다(LLM_KEY는 wrangler secret).
[ai]
binding = "AI"

# 로그인용 공개 ID(비밀 아님). 비어 있으면 그 로그인은 꺼진 상태.
[vars]
GOOGLE_CLIENT_ID = "992928610624-qivktlsooc8tifhdt6g0mmvckqdji7v2.apps.googleusercontent.com"
GOOGLE_IOS_CLIENT_ID = "992928610624-5cofgcgjg8c6c9a7j16gqm4mpheltpgk.apps.googleusercontent.com"
APPLE_SERVICES_ID = "com.hvsodream.dualplanner.web"
ADMIN_EMAILS = "withsky0@gmail.com"
# Google 캘린더 연결 뒤 돌아올 수 있는 주소(쉼표로 여럿). 비밀번호 GOOGLE_CLIENT_SECRET은 저장소 Secrets에서 넣는다
GCAL_REDIRECTS = "https://app.contenthibi.com/"
