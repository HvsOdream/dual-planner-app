name: check secrets
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 값이 들어 있는지
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: |
          for k in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 APPLE_TEAM_ID MATCH_PASSWORD MATCH_GIT_BASIC_AUTHORIZATION; do
            if [ -n "${!k}" ]; then echo "OK   $k"; else echo "없음 $k"; fi
          done
          [ "$APPLE_TEAM_ID" = "T2SNLBTTUX" ] && echo "OK   팀 ID 일치" || echo "확인 팀 ID가 T2SNLBTTUX가 아님"
          [ "$ASC_KEY_ID" = "V7AM49TB7V" ] && echo "OK   키 ID 일치" || echo "확인 키 ID가 V7AM49TB7V가 아님"
          if [ -n "$ASC_KEY_P8_BASE64" ]; then echo "$ASC_KEY_P8_BASE64" | base64 -d 2>/dev/null | grep -q "BEGIN PRIVATE KEY" && echo "OK   p8 키 해독됨" || echo "확인 p8 base64가 키로 안 풀림"; fi
          if [ -n "$MATCH_GIT_BASIC_AUTHORIZATION" ]; then
            echo "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 -d 2>/dev/null | grep -q '^HvsOdream:' && echo "OK   토큰 형식(HvsOdream:...)" || echo "확인 base64가 HvsOdream:토큰 형식이 아님"
            if git -c http.extraHeader="Authorization: Basic $MATCH_GIT_BASIC_AUTHORIZATION" ls-remote https://github.com/HvsOdream/ios-certs.git >/dev/null 2>&1; then echo "OK   ios-certs 접속됨"; else echo "실패 ios-certs 접속 안 됨"; fi
          fi
